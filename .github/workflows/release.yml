name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attest
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        shell: bash
        run: |
          test_script="$(node --print "require('./package.json').scripts.test")"
          if [[ "$test_script" == *"node --test"* ]]; then
            npm test -- --test-concurrency=1
          else
            npm test
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate release files
        shell: bash
        run: |
          manifest_version="$(node --print "require('./manifest.json').version")"
          if [[ "$RELEASE_TAG" != "$manifest_version" ]]; then
            echo "Tag $RELEASE_TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi
          test -s main.js
          test -f styles.css

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$RELEASE_TAG" main.js manifest.json styles.css \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
